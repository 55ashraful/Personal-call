<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00a884">
<meta name="mobile-web-app-capable" content="yes">
<title>Personal Call</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--wa-dark:#111b21;--wa-panel:#1f2c34;--wa-bg:#0b141a;--wa-bar:#202c33;--wa-teal:#00a884;--wa-teal-dark:#008f72;--wa-bubble-out:#005c4b;--wa-bubble-in:#202c33;--wa-text:#e9edef;--wa-text2:#8696a0;--wa-text3:#667781;--wa-border:#2a3942;--wa-overlay:rgba(0,0,0,0.6);--wa-danger:#ea0038;--wa-tick:#53bdeb;--radius:8px}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:var(--wa-text);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{width:100%;height:100%;max-width:500px;margin:0 auto;position:relative;overflow:hidden;background:var(--wa-bg)}
@media(min-width:501px){#app{border-left:1px solid var(--wa-border);border-right:1px solid var(--wa-border)}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(30px);transition:all .3s ease;pointer-events:none}
.scr.on{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto}
.scr.from-l{transform:translateX(-30px)}.scr.from-l.on{transform:translateX(0)}
.scr.slide-up{transform:translateY(100%)}.scr.slide-up.on{transform:translateY(0)}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:99999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);max-width:90%;text-align:center;pointer-events:none;background:var(--wa-panel);color:var(--wa-text);border:1px solid var(--wa-border)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{color:var(--wa-danger)}#toast.ok{color:var(--wa-teal)}
.topbar{height:56px;background:var(--wa-bar);display:flex;align-items:center;padding:0 12px;flex-shrink:0;border-bottom:1px solid var(--wa-border);z-index:10}
.topbar .back{width:40px;height:40px;border:none;background:none;color:var(--wa-text2);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;flex-shrink:0}
.topbar .back svg{width:24px;height:24px;fill:var(--wa-text2)}
.topbar .info{flex:1;min-width:0;margin-left:8px}
.topbar .info h3{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.topbar .info p{font-size:12px;color:var(--wa-text2);line-height:1.3}
.topbar .acts{display:flex;gap:4px;flex-shrink:0}
.tbtn{width:40px;height:40px;border:none;background:none;color:var(--wa-text2);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.tbtn svg{width:22px;height:22px;fill:var(--wa-text2)}
.av-sm{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--wa-panel)}
#phoneScr{background:var(--wa-bg);align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.login-bg{position:absolute;inset:0;overflow:hidden}
.login-bg::before{content:'';position:absolute;width:300px;height:300px;top:-100px;right:-80px;background:radial-gradient(circle,rgba(0,168,132,.08),transparent 70%)}
.login-card{width:100%;max-width:400px;position:relative;z-index:1;text-align:center}
.login-logo{width:72px;height:72px;margin:0 auto 20px;background:var(--wa-teal);border-radius:50%;display:flex;align-items:center;justify-content:center}
.login-logo svg{width:36px;height:36px;fill:#fff}
.login-card h1{font-size:24px;font-weight:600;color:var(--wa-teal);margin-bottom:4px}
.login-card .sub{font-size:13px;color:var(--wa-text2);margin-bottom:24px;line-height:1.5}
.fg{position:relative;margin-bottom:12px;text-align:left}
.fg input{width:100%;padding:13px 16px 13px 44px;background:var(--wa-panel);border:none;border-radius:var(--radius);color:var(--wa-text);font-size:14px;outline:none}
.fg input::placeholder{color:var(--wa-text3)}
.fg input:focus{box-shadow:0 0 0 2px var(--wa-teal)}
.fg .fi{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:var(--wa-text3);pointer-events:none}
.pbtn{width:100%;padding:13px;border:none;border-radius:var(--radius);background:var(--wa-teal);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.pbtn:disabled{opacity:.5}
.lnk{background:none;border:none;color:var(--wa-teal);font-size:13px;cursor:pointer;margin-top:16px;display:inline-block}
.phone-row{display:flex;gap:8px;margin-bottom:12px}
.cc-btn{flex-shrink:0;background:var(--wa-panel);border:none;border-radius:var(--radius);color:var(--wa-text);padding:0 12px;font-size:14px;display:flex;align-items:center;gap:5px;cursor:pointer;min-height:46px}
.cc-btn .caret{font-size:10px;color:var(--wa-text2)}
.phone-row input{flex:1;min-width:0;padding:13px 16px;background:var(--wa-panel);border:none;border-radius:var(--radius);color:var(--wa-text);font-size:14px;outline:none}
.phone-row input:focus{box-shadow:0 0 0 2px var(--wa-teal)}
.cc-ov{position:absolute;inset:0;z-index:500;background:var(--wa-overlay);display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:all .25s}
.cc-ov.on{opacity:1;visibility:visible}
.cc-sheet{width:100%;max-height:75%;background:var(--wa-dark);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s}
.cc-ov.on .cc-sheet{transform:translateY(0)}
.cc-head{padding:16px;display:flex;align-items:center;justify-content:space-between}
.cc-head h4{font-size:16px;font-weight:500}
.cc-head button{background:none;border:none;color:var(--wa-teal);font-size:14px;cursor:pointer}
.cc-search{margin:0 16px 10px}
.cc-search input{width:100%;padding:11px 14px;background:var(--wa-panel);border:none;border-radius:var(--radius);color:var(--wa-text);font-size:14px;outline:none}
.cc-list{flex:1;overflow-y:auto;padding-bottom:20px}
.cc-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer}
.cc-item .fl{font-size:22px}.cc-item .nm{flex:1;font-size:14px}.cc-item .dl{font-size:13px;color:var(--wa-text2)}
.otp-inputs{display:flex;gap:8px;justify-content:center;margin:20px 0}
.otp-inputs input{width:48px;height:52px;text-align:center;font-size:22px;font-weight:600;background:var(--wa-panel);border:2px solid var(--wa-border);border-radius:var(--radius);color:var(--wa-text);outline:none}
.otp-resend{font-size:12px;color:var(--wa-text2);margin-top:12px}
.otp-resend button{background:none;border:none;color:var(--wa-teal);cursor:pointer;font-size:12px}
.otp-resend button:disabled{color:var(--wa-text3)}
.tabs{display:flex;background:var(--wa-bar);border-bottom:1px solid var(--wa-border);flex-shrink:0}
.tab{flex:1;padding:14px 0;text-align:center;font-size:12.5px;font-weight:500;color:var(--wa-text3);cursor:pointer;border:none;background:none;position:relative}
.tab.on{color:var(--wa-teal)}
.tab.on::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:3px;background:var(--wa-teal);border-radius:3px 3px 0 0}
.chats-c{flex:1;overflow-y:auto;padding:4px 0}
.chat-row{display:flex;align-items:center;padding:10px 14px;cursor:pointer;gap:12px}
.chat-row .av{width:50px;height:50px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--wa-panel)}
.chat-row .det{flex:1;min-width:0;border-bottom:1px solid rgba(255,255,255,.04);padding-bottom:10px}
.chat-row .det h4{font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-row .det p{font-size:13px;color:var(--wa-text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.chat-row .meta .time{font-size:11px;color:var(--wa-text2)}
.mini-act{width:38px;height:38px;border:none;background:none;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-act svg{width:20px;height:20px;fill:var(--wa-teal)}
.mini-act.red svg{fill:var(--wa-danger)}
.msgs-c{flex:1;overflow-y:auto;padding:6px 14px;display:flex;flex-direction:column;gap:2px;background:var(--wa-bg)}
.date-sep{text-align:center;margin:10px 0}
.date-sep span{font-size:11.5px;color:var(--wa-text2);background:rgba(11,20,26,.9);padding:4px 12px;border-radius:6px}
.msg{max-width:80%;display:flex;flex-direction:column}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg.in{align-self:flex-start;align-items:flex-start}
.bbl{padding:6px 8px 8px;border-radius:8px;word-break:break-word;font-size:14px;line-height:1.45}
.msg.out .bbl{background:var(--wa-bubble-out);border-top-right-radius:0}
.msg.in .bbl{background:var(--wa-bubble-in);border-top-left-radius:0}
.msg .mt{font-size:11px;color:var(--wa-text2);margin-top:2px;display:flex;align-items:center;gap:3px}
.msg .mt .tick{font-size:14px;color:var(--wa-tick)}
.chat-img{max-width:100%;max-height:300px;border-radius:6px;display:block;cursor:pointer}
.vmsg{display:flex;align-items:center;gap:8px;min-width:170px;padding:2px 0}
.vplay{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.vbar{flex:1;height:4px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.vfill{height:100%;width:0;background:var(--wa-tick)}
.vdur{font-size:11px;color:var(--wa-text2);flex-shrink:0}
.chat-bar{display:flex;align-items:flex-end;padding:6px 10px;gap:6px;background:var(--wa-bar);flex-shrink:0}
.chat-bar .input-wrap{flex:1;display:flex;align-items:flex-end;background:var(--wa-panel);border-radius:24px;padding:6px 6px 6px 14px;min-height:44px;gap:8px}
.chat-bar textarea{flex:1;border:none;background:none;color:var(--wa-text);font-size:14px;outline:none;resize:none;max-height:100px;line-height:1.4;padding:4px 0;font-family:inherit}
.chat-bar .sbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--wa-teal);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.chat-bar .sbtn:disabled{opacity:.4}
.chat-bar .sbtn svg{width:20px;height:20px;fill:#fff}
.chat-bar .embtn{width:38px;height:42px;border:none;background:none;color:var(--wa-text2);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;flex-shrink:0}
.chat-bar .embtn svg{width:22px;height:22px;fill:var(--wa-text2)}
.rec-bar{flex:1;display:flex;align-items:center;gap:10px;background:var(--wa-panel);border-radius:24px;padding:8px 8px 8px 14px;min-height:44px}
.rec-dot{width:10px;height:10px;background:var(--wa-danger);border-radius:50%;animation:blink 1s infinite;flex-shrink:0}
@keyframes blink{50%{opacity:.2}}
.rec-bar .rtime{font-size:14px;flex:1}
.rec-bar .rbtn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec-bar .rbtn svg{width:18px;height:18px;fill:#fff}
#imgViewer{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center}
#imgViewer.on{display:flex}
#imgViewer img{max-width:95%;max-height:88%;object-fit:contain}
#imgViewerClose{position:absolute;top:14px;right:14px;width:42px;height:42px;border:none;background:rgba(255,255,255,.15);border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
#callScr{background:#000;z-index:100}
.call-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(30px) brightness(.3);transform:scale(1.2)}
.call-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.call-info{position:relative;z-index:5;text-align:center;padding-top:100px;flex:1;display:flex;flex-direction:column;align-items:center}
.call-info .cav{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:16px;border:2px solid rgba(255,255,255,.2)}
.call-info h2{font-size:24px;font-weight:500;margin-bottom:4px}
.call-info .cst{font-size:14px;color:rgba(255,255,255,.7)}
.call-info .ctimer{font-size:15px;color:var(--wa-teal);margin-top:2px}
.call-vid{position:absolute;inset:0;z-index:2}
.call-vid video{width:100%;height:100%;object-fit:cover}
.pip{position:absolute;top:60px;right:16px;width:100px;height:140px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.2);z-index:8;background:#1a1a1a}
.pip video{width:100%;height:100%;object-fit:cover}
.pip.off::after{content:'ক্যামেরা বন্ধ';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1f2c34;font-size:11px;color:#8696a0}
.call-ctrls{position:relative;z-index:10;padding:30px 20px 50px;display:flex;align-items:center;justify-content:center;gap:20px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);margin-top:auto}
.ccb{width:56px;height:56px;border-radius:50%;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.12);color:#fff}
.ccb svg{width:24px;height:24px;fill:#fff}
.ccb .cl{font-size:9px;margin-top:3px;opacity:.8}
.ccb.off{background:var(--wa-danger)}
.ccb.end{width:64px;height:64px;background:var(--wa-danger)}
#incPop{position:absolute;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:var(--wa-overlay);opacity:0;visibility:hidden;transition:all .3s}
#incPop.on{opacity:1;visibility:visible}
.inc-card{width:100%;padding:36px 24px 48px;background:var(--wa-dark);border-radius:20px 20px 0 0;text-align:center;transform:translateY(100%);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
#incPop.on .inc-card{transform:translateY(0)}
.inc-av{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:16px;animation:ir 2s ease-in-out infinite}
@keyframes ir{0%,100%{box-shadow:0 0 0 0 rgba(0,168,132,.4)}50%{box-shadow:0 0 0 12px rgba(0,168,132,0)}}
.inc-name{font-size:22px;font-weight:500;margin-bottom:4px}
.inc-type{font-size:13px;color:var(--wa-text2);margin-bottom:32px}
.inc-btns{display:flex;justify-content:center;gap:50px}
.inc-b{display:flex;flex-direction:column;align-items:center;gap:8px;border:none;background:none;cursor:pointer}
.inc-b .cir{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.inc-b .cir svg{width:28px;height:28px;fill:#fff}
.inc-b.acc .cir{background:var(--wa-teal)}
.inc-b.rej .cir{background:var(--wa-danger)}
.inc-b span:last-child{font-size:11px;color:var(--wa-text2)}
.set-list{flex:1;overflow-y:auto;padding:8px 0}
.set-item{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer}
.set-item .si-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.set-item .si-text h4{font-size:15px;font-weight:400}
.set-item .si-text p{font-size:12px;color:var(--wa-text2);margin-top:1px}
.set-divider{height:8px;background:rgba(0,0,0,.2)}
.set-header{padding:20px 20px 12px;font-size:13px;color:var(--wa-teal);font-weight:500}
.dial-disp{background:var(--wa-panel);border-radius:var(--radius);padding:16px;text-align:center;margin:16px 14px 4px}
.dial-disp input{width:100%;background:none;border:none;outline:none;color:var(--wa-text);font-size:24px;text-align:center;font-weight:500}
.dial-disp input::placeholder{color:var(--wa-text3);font-size:14px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 40px}
.key{height:60px;border:none;background:var(--wa-panel);border-radius:50%;font-size:24px;color:var(--wa-text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.key small{font-size:8px;color:var(--wa-text2);margin-top:2px}
.key:active{background:var(--wa-border)}
.dial-acts{display:flex;padding:0 14px}
.dial-acts button{flex:1;padding:12px;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;background:var(--wa-panel);color:var(--wa-text)}
.dial-acts button.pr{background:var(--wa-teal);color:#fff}
.dial-card{margin:10px 14px;background:var(--wa-panel);border-radius:12px;padding:16px;text-align:center}
.dial-card img{width:70px;height:70px;border-radius:50%;object-fit:cover;margin-bottom:8px}
.dial-card h4{font-size:17px}.dial-card p{font-size:13px;color:var(--wa-text2);margin:2px 0 14px}
.dial-card .dc-btns{display:flex;gap:10px;justify-content:center}
.dial-card .dc-btns button{flex:1;max-width:110px;padding:11px 4px;border:none;border-radius:var(--radius);background:var(--wa-teal);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.dial-card .dc-btns button.ghost{background:var(--wa-bar);color:var(--wa-text)}
.dial-card .dc-btns button svg{width:16px;height:16px;fill:#fff}
.dial-card .dc-btns button.ghost svg{fill:var(--wa-text)}
.sec-label{padding:14px 20px 6px;font-size:12px;color:var(--wa-teal);font-weight:600}
.sp{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.ring-circles{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3}
.ring-circles .rc{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);animation:rcp 2.5s ease-out infinite}
.ring-circles .rc:nth-child(1){width:130px;height:130px}
.ring-circles .rc:nth-child(2){width:180px;height:180px;animation-delay:.6s}
.ring-circles .rc:nth-child(3){width:230px;height:230px;animation-delay:1.2s}
@keyframes rcp{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.2);opacity:0}}
.fab{position:absolute;bottom:20px;right:16px;width:56px;height:56px;border-radius:16px;border:none;background:var(--wa-teal);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:5}
.fab svg{width:24px;height:24px;fill:#fff}
.empty-st{text-align:center;padding:60px 20px;color:var(--wa-text2)}
.empty-st p{font-size:14px;line-height:1.6}
/* ★ স্টার্টআপ লোডিং স্ক্রিন — ৬ সেকেন্ডে নিজে সরে ★ */
#bootLoader{position:fixed;inset:0;z-index:999999;background:#0b141a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .3s}
#bootLoader.hide{opacity:0;pointer-events:none}
#bootLoader .bl-spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#00a884;border-radius:50%;animation:spin .7s linear infinite}
#bootLoader p{color:#8696a0;font-size:13px}
</style>
</head>
<body>
<div id="app">
<div id="toast"></div>

<section id="phoneScr" class="scr on">
<div class="login-bg"></div>
<div class="login-card">
<div class="login-logo"><svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg></div>
<h1>Personal Call</h1>
<p class="sub">রিয়েল নম্বর ও ইমেইল দিয়ে অ্যাকাউন্ট খুলুন</p>
<div class="fg"><input type="text" id="nameIn" placeholder="আপনার নাম" autocomplete="off"><svg class="fi" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
<div class="phone-row">
<button class="cc-btn" id="ccBtn"><span id="ccFlag">🇧🇩</span> <span id="ccCode">+880</span> <span class="caret">▼</span></button>

<button class="lnk" id="showEmailLogin">অ্যাকাউন্ট আছে? ইমেইল দিয়ে লগইন করুন</button>

</section>

<div class="cc-ov" id="ccOv">

<div class="cc-search"><input type="text" id="ccSearchIn" placeholder="দেশ বা কোড খুঁজুন..."></div>
<div class="cc-list" id="ccList"></div>
</div>
</div>

<section id="emailScr" class="scr">
<div class="topbar">
<button class="back" id="emailBack"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
<div class="info"><h3>লগইন করুন</h3></div>
</div>
<div style="flex:1;padding:24px 20px;display:flex;flex-direction:column;gap:14px;justify-content:center">
<div class="fg"><input type="email" id="loginEmailIn" placeholder="ইমেইল ঠিকানা" autocomplete="off"><svg class="fi" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></div>

<button class="pbtn" id="loginBtn">লগইন করুন</button>
</div>
</section>

<section id="otpScr" class="scr">
<div class="topbar">
<button class="back" id="otpBack"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
<div class="info"><h3>ইমেইল ভেরিফিকেশন</h3><p id="otpPhone">-</p></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">

</div>
<button class="pbtn" id="verifyOtpBtn" style="margin-top:24px;max-width:300px">ভেরিফাই করুন</button>

</div>
</section>

<section id="mainScr" class="scr">
<div class="topbar">
<div class="info"><h3>Personal Call</h3></div>
<div class="acts">

<div id="tabContacts" style="flex:1;overflow-y:auto;display:none"></div>

</div>
